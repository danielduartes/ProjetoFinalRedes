flush ruleset

table inet filter {
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "enp0s3" oifname "enp0s8" ip daddr 10.0.1.10 tcp dport { 80, 443 } accept
    iifname "enp0s8" oifname "enp0s10" ip saddr 10.0.1.10 ip daddr 10.0.3.10 tcp dport 5432 accept
    iifname "enp0s10" oifname "enp0s9" ip saddr 10.0.3.10 ip daddr 10.0.2.10 tcp dport 445 accept
    iifname "enp0s9" tcp dport 22 accept
    iifname { "enp0s8", "enp0s9", "enp0s10" } oifname "enp0s3" accept
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority -100;
    iifname "enp0s3" tcp dport 80 dnat to 10.0.1.10:80
    iifname "enp0s3" tcp dport 443 dnat to 10.0.1.10:443
  }
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "enp0s3" masquerade
  }
}
