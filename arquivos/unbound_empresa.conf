server:
    interface: 10.0.2.1
    interface: 10.0.1.1
    interface: 10.0.3.1
    access-control: 10.0.0.0/16 allow
    do-not-query-localhost: no
    domain-insecure: "empresa.local"
    private-domain: "empresa.local"

    local-zone: "empresa.local." static
    local-data: "fw.empresa.local. IN A 10.0.2.1"
    local-data: "web.empresa.local. IN A 10.0.1.10"
    local-data: "arquivos.empresa.local. IN A 10.0.2.10"
    local-data: "db.empresa.local. IN A 10.0.3.10"

    local-zone: "1.0.10.in-addr.arpa." static
    local-data-ptr: "10.0.1.10 web.empresa.local"
    local-zone: "2.0.10.in-addr.arpa." static
    local-data-ptr: "10.0.2.10 arquivos.empresa.local"
    local-zone: "3.0.10.in-addr.arpa." static
    local-data-ptr: "10.0.3.10 db.empresa.local"

forward-zone:
    name: "."
    forward-addr: 8.8.8.8
