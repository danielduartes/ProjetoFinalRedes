[global]
   workgroup = WORKGROUP
   server string = Servidor de Arquivos
   server role = standalone server
   interfaces = 10.0.2.10/24 lo
   bind interfaces only = yes
   hosts allow = 10.0.2.0/24 10.0.3.10 127.0.0.1
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000

[publico]
   path = /compartilhado/publico
   read only = no
   valid users = @devs @mkt @diretoria @backup_mgr
   create mask = 0664
   directory mask = 0775

[projetos]
   path = /compartilhado/projetos
   read only = no
   valid users = @devs
   force group = devs
   create mask = 0660
   directory mask = 2770

[backups]
   path = /compartilhado/backups
   read only = no
   valid users = @backup_mgr
   force group = backup_mgr
   create mask = 0660
   directory mask = 2770
